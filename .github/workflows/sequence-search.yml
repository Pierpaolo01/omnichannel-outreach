name: sequence-search

# The sequence engine's full generated-sequence and mutation search (ADR 0003 9.2): all 100 seeds,
# each also in its unlimited-capacity variant, and a seed search per mutation that prints the seed
# killing each. It runs before a merge of a change to the engine, not on every push: by hand, or
# when a pull request gets the `sequence-search` label. `pnpm check` runs the fixed seeds and the
# known killing seeds instead. Each shard runs every eighth seed and every eighth mutation; a
# mutation's seed search tries its recorded seed and at most 30 seed offsets (its named regression,
# if it has one, still runs), and every mutation replay stops after 10,000 engine writes, with a
# ten-minute wall-clock limit per replay only as a safety net. The unmutated seed runs carry neither
# bound. A shard of about four mutations and thirteen seeds finishes well inside the step's limit.
# The same command runs the ticket 13 track generator (src/server/sequence-runs-tracks*.test.ts)
# and the ticket 14 call generator (src/server/sequence-runs-calls*.test.ts): their 100 seeds and a
# seed search per mutation, sharded the same way; each of their runs takes a few seconds.
# Each shard then runs its share of the save rule's generated test (ADR 0003 1.1.1,
# src/web/campaign/saveQueue.generated.test.ts): 2,000 seeds in all, every eighth to a shard, each
# run a few dozen milliseconds. `pnpm check` runs 200 of them and every seed that once failed.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  search:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'sequence-search'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sequence-search
        timeout-minutes: 80
        env:
          CI: "true"
          SEQUENCE_SHARD: ${{ matrix.shard }}/8
      - run: pnpm test:save-search
        # Its own result, whatever the engine's search found in this shard.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          CI: "true"
          SEQUENCE_SHARD: ${{ matrix.shard }}/8
