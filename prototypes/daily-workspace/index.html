<title>Outreach Daily Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE, throwaway. Question: what should the daily workspace show for calls and lead management?
     Ticket: Choose the daily workspace for calls and lead management (omnichannel-outreach #6).
     Person page has three layouts (A/B/C) switchable from the corner control. Invented example data; nothing persists. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail + one working area. The call sheet is the one loud element: a dark in-call header with the name and number large. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --raised:#F8F9FB; --line:#E1E5EC; --line-strong:#C9CFDA;
  --ink:#151A2D; --ink-2:#3A4157; --muted:#636B80; --faint:#949BAD;
  --call:#0B8A5F; --call-hover:#097550; --call-ink:#FFFFFF; --call-soft:#E2F4EC;
  --band:#151A2D; --band-ink:#FFFFFF; --band-muted:#A9B0C6;
  --you:#0B7A55; --you-soft:#E2F4EC; --hand:#2C55C9; --hand-soft:#E5ECFB; --pause:#9A5A00; --pause-soft:#FCEFD9; --end:#6B7285; --end-soft:#EDEFF3; --crit:#C0352B; --crit-soft:#FBE6E4;
  --f:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r:9px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F131E; --surface:#161B28; --raised:#1B2131; --line:#262D3E; --line-strong:#36405A;
  --ink:#E8EBF3; --ink-2:#C5CADA; --muted:#98A0B5; --faint:#6D7590;
  --call:#22B07D; --call-hover:#2BC48B; --call-ink:#04170F; --call-soft:#123327;
  --band:#222A3E; --band-ink:#FFFFFF; --band-muted:#A9B0C6;
  --you:#4CCB9A; --you-soft:#123327; --hand:#8AA8F5; --hand-soft:#1A2646; --pause:#F0B35A; --pause-soft:#3A2A10; --end:#98A0B5; --end-soft:#21283A; --crit:#F2928B; --crit-soft:#3E1C1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F131E; --surface:#161B28; --raised:#1B2131; --line:#262D3E; --line-strong:#36405A;
  --ink:#E8EBF3; --ink-2:#C5CADA; --muted:#98A0B5; --faint:#6D7590;
  --call:#22B07D; --call-hover:#2BC48B; --call-ink:#04170F; --call-soft:#123327;
  --band:#222A3E; --band-ink:#FFFFFF; --band-muted:#A9B0C6;
  --you:#4CCB9A; --you-soft:#123327; --hand:#8AA8F5; --hand-soft:#1A2646; --pause:#F0B35A; --pause-soft:#3A2A10; --end:#98A0B5; --end-soft:#21283A; --crit:#F2928B; --crit-soft:#3E1C1A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em}
h2{font-size:19px;line-height:1.25}
h3{font-size:15px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--call);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:28px;padding:24px 14px 20px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 10px;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.brand .mark svg{width:15px;height:15px;stroke-width:2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--raised)}
.nav a.on{background:var(--paper);color:var(--ink);font-weight:600}
.nav a.on svg{color:var(--call)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--call);color:var(--call-ink);min-width:22px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.rail .foot{margin-top:auto;margin-bottom:56px;padding:0 10px;font-size:12px;color:var(--faint);line-height:1.45}
.rail .foot a{color:var(--muted)}
.main{min-width:0;padding:32px max(16px,env(safe-area-inset-right,0px)) 96px 40px}
.page{max-width:1180px}
.search-top{display:flex;justify-content:flex-end;margin-bottom:22px}
.search-top label{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;width:340px;max-width:100%;color:var(--muted)}
.search-top label input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);padding:0}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;border-radius:var(--r);font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.go{background:var(--call);border-color:var(--call);color:var(--call-ink);font-weight:600}
.btn.go:hover{background:var(--call-hover)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--raised)}
.btn.warn{color:var(--crit)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=time],select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 10px;font-size:14px}
textarea{width:100%;min-height:76px;resize:vertical;line-height:1.45}
label.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
label.check input{margin-top:3px;accent-color:var(--call)}

/* status */
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;padding:2px 8px 2px 7px;border-radius:var(--r-sm)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.g-run{color:var(--ink-2);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.g-you{color:var(--you);background:var(--you-soft)}
.g-hand{color:var(--hand);background:var(--hand-soft)}
.g-pause{color:var(--pause);background:var(--pause-soft)}
.g-end{color:var(--end);background:var(--end-soft)}
.g-end::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}

/* today */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
.today-head .date{color:var(--muted);font-size:15px;margin-bottom:6px}
.today-head h1{font-size:38px}
.today-head .lede{font-size:18px;color:var(--ink-2);margin-top:8px;max-width:46ch}
.btn.start{padding:14px 22px;font-size:16px;border-radius:12px;gap:10px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;padding-top:28px}
.upnext ul{margin:0;padding:0}
.upnext li{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.upnext li:first-child{border-top:0}
.upnext .who{font-weight:600}
.upnext .why{font-size:13px;margin-top:2px;font-weight:500}
.upnext .lt{text-align:right;font-size:13px;color:var(--muted)}
.upnext .lt b{display:block;font-size:17px;color:var(--ink);font-weight:500}
.later-note{margin-top:14px;font-size:13px;color:var(--muted)}
.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.attn li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.attn .dot{width:9px;height:9px;border-radius:50%;margin-top:7px}
.attn .txt b{font-weight:600}
.attn .txt p{font-size:13.5px;color:var(--muted);margin-top:2px}
.attn .act{grid-column:2;margin-top:8px}
.calm{color:var(--muted);font-size:14px;padding:14px 0}

/* calls */
.calls{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.queue{position:sticky;top:24px}
.queue .grp{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 10px}
.qlist{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;text-align:left;width:100%;border:0;background:transparent;padding:10px;border-radius:var(--r)}
.qi:hover{background:var(--surface)}
.qi.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--call),0 0 0 1px var(--line)}
.qi .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .co{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .lt{font-size:13px;color:var(--muted);text-align:right}
.qi .why{grid-column:1/-1;font-size:12.5px;margin-top:3px;font-weight:500}
.why-crit{color:var(--crit)} .why-you{color:var(--you)} .why-pause{color:var(--pause)} .why-muted{color:var(--muted)}
.rule{font-size:12.5px;color:var(--faint);padding:0 10px;line-height:1.45}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:clip}
.band{background:var(--band);color:var(--band-ink);padding:26px 30px 28px}
.band .reason{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--band-muted)}
.band .reason.crit{color:#FFB4AC}
.band .reason.you{color:#7BE0B5}
.band-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.band h1{font-size:44px;letter-spacing:-.03em;line-height:1.05;margin-top:10px}
.band h1 a{text-decoration:none}
.band h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.band .role{color:var(--band-muted);font-size:16px;margin-top:6px}
.band .role b{color:var(--band-ink);font-weight:500}
.band .clock{text-align:right}
.band .clock .t{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1}
.band .clock .w{font-size:13px;color:var(--band-muted);margin-top:6px}
.band .clock .w.ok{color:#7BE0B5} .band .clock .w.no{color:#FFCE85}
.dial{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.num{display:grid;grid-template-columns:minmax(0,auto) auto auto;justify-content:start;align-items:center;gap:14px}
.num .v{font-size:26px;font-weight:500;letter-spacing:.01em}
.num.alt .v{font-size:17px;color:var(--band-muted);font-weight:400}
.num .kind{font-size:13px;color:var(--band-muted)}
.num.bad .v{text-decoration:line-through;text-decoration-thickness:1.5px;color:#7F879E}
.btn.callbtn{background:var(--call);border-color:var(--call);color:#fff;font-weight:600;padding:8px 16px;border-radius:22px}
.btn.callbtn:hover{background:var(--call-hover)}
.btn.callbtn.alt{background:transparent;border-color:#4A5372;color:var(--band-ink);padding:4px 12px;font-size:13px}
.dialing{margin-top:10px;font-size:13px;color:#7BE0B5;display:flex;gap:8px;align-items:center}
.dialing .pulse{width:8px;height:8px;border-radius:50%;background:#7BE0B5;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sheet-body>section{padding:24px 30px;min-width:0}
.sheet-body>section+section{border-left:1px solid var(--line)}
.askfor{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.askfor li .n{font-weight:600}
.askfor li .r{font-size:13.5px;color:var(--muted)}
.askfor li .q{font-size:13.5px;color:var(--ink-2);margin-top:3px;padding-left:10px;border-left:2px solid var(--line-strong)}
.conote{margin-top:14px;font-size:13.5px;background:var(--raised);border-radius:var(--r);padding:10px 12px}
.conote b{font-weight:600}
.script{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:8px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(45deg)}
.logbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:20px 30px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 24px -18px rgba(21,26,45,.35)}
.notes-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.notes-row label.top{font-size:13px;font-weight:600;color:var(--muted)}
.outs{display:flex;flex-wrap:wrap;gap:8px}
.out{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:14px;font-weight:500}
.out:hover{border-color:var(--ink-2)}
.out.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.subopts{background:var(--raised);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 12px;padding:12px 0}
.tl li+li{border-top:1px solid var(--line)}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tl .ic svg{width:16px;height:16px}
.tl .k-call .ic{color:var(--call);background:var(--call-soft);box-shadow:none}
.tl .k-reply .ic{color:var(--hand);background:var(--hand-soft);box-shadow:none}
.tl .k-note .ic{color:var(--pause);background:var(--pause-soft);box-shadow:none}
.tl .t{font-weight:500;padding-top:5px;min-width:0}
.tl .c{font-size:13px;color:var(--muted);font-weight:400}
.tl .b{font-size:14px;color:var(--ink-2);margin-top:3px}
.tl time{font-size:13px;color:var(--muted);padding-top:6px;white-space:nowrap;text-align:right}
.tl .body{grid-column:2/-1;min-width:0}
.tl details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px;list-style:none;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.tl details summary::-webkit-details-marker{display:none}
.tl .msg{white-space:pre-wrap;font-size:14px;line-height:1.55;background:var(--raised);border-radius:var(--r);padding:12px 14px;margin-top:8px;color:var(--ink-2)}
.tl .msg .subj{display:block;font-weight:600;color:var(--ink);margin-bottom:8px}
.tl li.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{from{background:var(--call-soft)}to{background:transparent}}
.compact .tl li{padding:9px 0;grid-template-columns:26px minmax(0,1fr) auto}
.compact .tl .ic{width:26px;height:26px}
.compact .tl .ic svg{width:14px;height:14px}
.compact .tl .t{padding-top:2px;font-size:14px}
.compact .tl time{padding-top:3px}

/* leads */
.lead-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.bigsearch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:11px 16px;color:var(--muted)}
.bigsearch input{border:0;outline:0;background:transparent;width:100%;font-size:17px;color:var(--ink);padding:0}
.bigsearch:focus-within{border-color:var(--call);box-shadow:0 0 0 3px var(--call-soft)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters .clear{margin-left:auto}
.table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:13px;color:var(--muted);text-align:left;font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
tr.selected td{background:var(--call-soft)}
td .nm{font-weight:600}
td .sub{font-size:13px;color:var(--muted)}
.enrl{display:flex;flex-direction:column;gap:6px}
.enrl div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.enrl .cn{font-size:13px;color:var(--muted);min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--call);width:16px;height:16px}
.bulk{position:sticky;top:12px;z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;margin-top:16px;box-shadow:0 10px 30px -12px rgba(21,26,45,.5)}
.bulk b{font-weight:600;margin-right:6px}
.bulk .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 35%,transparent)}
.bulk .btn:hover{border-color:var(--paper)}
.bulk select{background:var(--ink);color:var(--paper);border-color:color-mix(in srgb,var(--paper) 35%,transparent)}
.bulk .end{margin-left:auto}
.confirm{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pause-soft);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:14px}
.confirm span{flex:1 1 320px}
.foot-note{font-size:13px;color:var(--muted);margin-top:12px}

/* campaigns */
.camps{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center}
.camp h2{font-size:17px}
.camp .meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.seq{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:12px}
.seq .s{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--raised);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.seq .s svg{width:15px;height:15px}
.seq .s.wb{color:var(--hand);background:var(--hand-soft);box-shadow:none}
.seq .gap{width:10px;height:1.5px;background:var(--line-strong)}
.seq .lbl{font-size:12.5px;color:var(--muted);margin:0 4px 0 8px}

/* person shared */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:18px}
.back:hover{color:var(--ink)}
.p-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.p-head .kind{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.p-head h1{font-size:34px}
.p-head .role{font-size:16px;color:var(--ink-2);margin-top:4px}
.p-head .role a{font-weight:600;text-decoration:none}
.p-head .role a:hover{text-decoration:underline}
.localtime{text-align:right}
.localtime .t{font-size:26px;font-weight:500;line-height:1}
.localtime .w{font-size:13px;color:var(--muted);margin-top:4px}
.facts{display:flex;flex-direction:column;font-size:14.5px;margin:0}
.facts dt{color:var(--muted);font-size:12.5px;margin-top:12px}

  const notes = [

function fmtDay(d){ if(d===0)return'Today'; if(d===-1)return'Yesterday'; if(d===1)return'Tomorrow';
  return dayDate(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
const hm = m=>`${String(Math.floor((((m%1440)+1440)%1440)/60)).padStart(2,'0')}:${String(((m%60)+60)%60).padStart(2,'0')}`;
const toMin = t=>{const[a,b]=t.split(':').map(Number);return a*60+b};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3800)}

function goodNumbers(p){ const n=p.phones.filter(x=>!x.bad); const co=company(p); return co.main&&!co.main.bad?n.concat([{v:co.main.v,t:'main line'}]):n }
function allNumbers(p){ const order={direct:0,mobile:1,'main line':2}; const n=p.phones.map(x=>({...x})); const co=company(p); if(co.main) n.push({v:co.main.v,t:'main line',bad:co.main.bad}); return n.sort((a,b)=>(!!a.bad-!!b.bad)||(order[a.t]-order[b.t])) }
const colleaguesOf = p=>Object.values(S.people).filter(x=>x.k===p.k&&x.id!==p.id);

/* ============ call queue ============ */
function callTasks(){
  const ready=[],later=[];
  for(const e of S.enrollments){
    if(C(e.c).state!=='active')continue;
    const p=P(e.p), ln=localNow(p);
    let key,kind,why,tone,isLater=false;
    if(e.status==='waiting_call' && e.callDue<=0){ key=e.callDue*1440; kind='call';
      if(e.callDue<0){why='Rolled over from yesterday, last day before it’s skipped';tone='pause'} else {why='Due today';tone='muted'}
      if(ln<HOURS.start){isLater=true;why=`Their calling hours start at ${hm(HOURS.start-company(p).tz)} your time`;tone='muted'} }
    else if(e.status==='callback' && e.cb.day<=0){ key=e.cb.day*1440+toMin(e.cb.time); kind='callback';
      const overdue=e.cb.day<0||toMin(e.cb.time)<ln;
      if(overdue){why=`Callback overdue since ${fmtDay(e.cb.day).toLowerCase()} at ${e.cb.time}`;tone='crit'} else {why=`Callback they asked for at ${e.cb.time} their time`;tone='you';isLater=true} }
    else continue;
    (isLater?later:ready).push({e,p,key,kind,why,tone,overdue:tone==='crit'});
  }
  ready.sort((a,b)=>a.key-b.key); later.sort((a,b)=>a.key-b.key);
  return {ready,later};
}

function nextAfterCall(e){ const n=stepsOf(e)[e.idx+1]; return n?`the next step (${n[1].toLowerCase()}) is scheduled`:'the sequence ends' }

/* ============ timeline ============ */
function timeline(list,{compact=false}={}){

    const p=P(x.p); let body='';

      body=`<details><summary>Show message</summary><div class="msg">${cpy[0]?`<span class="subj">${esc(renderCopy(cpy[0],p))}</span>`:''}${esc(renderCopy(cpy[1],p))}</div></details>`; } }
    else if(x.body) body=`<div class="b">${esc(x.body)}</div>`;
    return `<li class="k-${x.kind} ${x.fresh?'fresh':''}"><span class="ic">${I[x.kind]||I.system}</span><div class="t">${esc(x.title)}${!compact&&x.c?` <span class="c">in ${esc(C(x.c).name)}</span>`:''}</div><time>${esc(whenText(x))}</time>${body?`<div class="body">${body}</div>`:''}</li>`}).join('')}</ul>`;

function personEvents(pid,cfilter){

  const ns=S.notes.filter(n=>n.p===pid||(n.k&&n.k===p.k)).map(n=>({p:pid,c:null,day:n.day,time:n.time,kind:'note',title:n.k?'Company note':'Note',body:n.text,fresh:n.fresh}));

/* ============ Leads ============ */
function viewLeads(){
  const u=S.ui, q=u.q.trim().toLowerCase(), qd=q.replace(/[\s+]/g,'');
  const rows=Object.values(S.people).filter(p=>{
    const co=company(p);
    const hay=[p.name,co.name,...p.emails.map(x=>x.v),co.inbox||''].join(' ').toLowerCase();
    const digits=[...p.phones.map(x=>x.v),co.main?.v||''].join(' ').replace(/[\s+]/g,'');
    if(q && !hay.includes(q) && !(qd.length>=3 && /^\d+$/.test(qd) && digits.includes(qd))) return false;
    const es=enrOf(p.id);
    if(u.fc && !es.some(e=>e.c===u.fc)) return false;
    if(u.fs && !es.some(e=>e.status===u.fs && (!u.fc||e.c===u.fc))) return false;
    return true;
  });

function stepClass(e,i,wb){
  const cp=C(e.c);
  if(wb) return 'wb '+(i<e.idx?'done':i===e.idx&&e.status==='winback'?'cur':'');
  if(e.branch==='wb') return i<cp.steps.length-1?'done':'skip';
  if(e.skipped.includes(i)) return 'skip';
  if(i<e.idx) return 'done';
  if(i===e.idx && LIVE.concat(['paused']).includes(e.status)) return 'cur';
  return '';
}
function track(e){
  const cp=C(e.c);
  const main=cp.steps.map((s,i)=>`${i?'<span class="ln"></span>':''}<span class="s ${stepClass(e,i,false)}" title="${esc(s[1])}">${I[s[0]]}</span>`).join('');
  const wb=e.branch==='wb'?`<span class="br">win-back</span>`+cp.wb.map((s,i)=>`${i?'<span class="ln"></span>':''}<span class="s ${stepClass(e,i,true)}" title="${esc(s[1])}">${I[s[0]]}</span>`).join(''):'';
  return `<div class="track" aria-label="Sequence progress">${main}${wb}</div>`;
}
function nextLine(e){
  const st=stepsOf(e);
  if(e.status==='waiting_call') return C(e.c).state==='paused'?'The call is on hold while this campaign is paused.':e.callDue<=0?'Their call is on today’s list.':`Their call is on ${fmtDay(e.callDue).toLowerCase()}’s list.`;
  if(e.status==='callback') return `Callback ${fmtDay(e.cb.day).toLowerCase()} at ${e.cb.time} their time${e.cb.day<0?', now overdue':''}. Messages are paused until then.`;
  if(e.status==='replied') return `Replied by ${e.replied.ch.toLowerCase()} ${fmtDay(e.replied.day).toLowerCase()}. Answer in ${e.replied.ch==='Email'?'Instantly':'your phone’s messages'}.`;
  if(e.status==='interested') return 'Interested on the call. Over to you.';
  if(e.status==='queued') return `The ${st[e.idx][1].toLowerCase()} goes out when an inbox has room, in about 9 days.`;
  if(['active','winback'].includes(e.status) && e.idx<st.length) return `Next: ${st[e.idx][1].toLowerCase()}, ${fmtDay(e.nextDue??1).toLowerCase()} between 09:00 and 17:00 their time.`;
  if(e.status==='paused') return `Paused before the ${stepLabel(e).toLowerCase()}. Waiting times are frozen.`;
  if(e.status==='finished_nouse') return 'Every email and phone number is missing or marked wrong.';
  if(e.status==='finished_nr') return 'Every step went out and nobody replied.';
  if(e.status==='declined') return 'Declined on the call. Nothing else goes out in this campaign.';
  if(e.status==='stopped') return 'You stopped this campaign for them.';
  return '';
}
function controls(e){
  const b=(a,l,cls='')=>`<button class="btn small ${cls}" data-act="${a}" data-e="${e.id}">${l}</button>`;
  const more=e.idx<stepsOf(e).length; let h='';
  if(LIVE.includes(e.status)) h=b('pause','Pause')+b('skip','Skip this step')+b('stop','Stop','warn');
  else if(e.status==='paused') h=b('resume','Resume')+b('stop','Stop','warn');
  else if(['replied','stopped','declined'].includes(e.status)){ if(more) h+=b('resume','Resume from the next step'); if(C(e.c).winback&&e.branch!=='wb') h+=b('winback','Move to win-back'); }

}

/* ============ actions ============ */
function advance(e){
  const st=stepsOf(e);
  if(e.idx>=st.length){ e.status='finished_nr'; return }
  if(st[e.idx][0]==='call'){ e.status='waiting_call'; e.callDue=1; e.rolled=0 } else { e.status=e.branch==='wb'?'winback':'active'; e.nextDue=1 }
}
function act(kind,eid){
  const e=S.enrollments.find(x=>x.id===eid), p=P(e.p), cp=C(e.c);
  if(kind==='pause'){ e.prev=e.status; e.status='paused'; addEv(p.id,e.c,'system','Paused by you','Waiting times are frozen.'); toast(`Paused ${p.name} in ${cp.name}`) }
  if(kind==='resume'){ const was=e.status; if(was==='paused') e.status=e.prev||'active'; else advance(e);
    addEv(p.id,e.c,'system',was==='paused'?'Resumed':'Resumed from the next step',stepLabel(e)?`Next: ${stepLabel(e).toLowerCase()}.`:''); toast(`Resumed ${p.name} in ${cp.name}`) }
  if(kind==='skip'){ const l=stepLabel(e); e.skipped.push(e.idx); e.idx++; advance(e); addEv(p.id,e.c,'system',`${l} skipped by you`); toast(`Skipped the ${l.toLowerCase()} for ${p.name}`) }
  if(kind==='stop'){ e.status='stopped'; addEv(p.id,e.c,'system','Stopped by you',`Nothing else goes out in ${cp.name}.`); toast(`Stopped ${p.name} in ${cp.name}`) }
  if(kind==='winback'){ e.branch='wb'; e.idx=0; e.status='winback'; e.nextDue=1; addEv(p.id,e.c,'system','Moved to win-back','The remaining main steps were dropped.'); toast(`Moved ${p.name} to win-back`) }
  render();
}
function logOutcome(){
  const e=S.enrollments.find(x=>x.id===S.ui.cur), p=P(e.p), cp=C(e.c), o=S.ui.outcome, sub=S.ui.sub;
  const note=($('#callnote')?.value||'').trim();
  if(o==='gatekeeper' && !note){ toast('Add a note about who you spoke to, then log it.'); $('#callnote').focus(); return }
  const names={no_answer:'no answer',voicemail:'left voicemail',gatekeeper:'didn’t reach them',wrong:'wrong number',callback:'callback requested',interested:'interested',declined:'not interested',skip:'skipped for now'};
  let body=note, stay=false, msg='';
  if(['no_answer','voicemail','gatekeeper'].includes(o)){
    if(sub.redial){ e.status='waiting_call'; e.callDue=1; e.rolled=0; delete e.cb; body=[note,'Calling again tomorrow.'].filter(Boolean).join(' '); msg='Back on tomorrow’s list.' }
    else { e.idx++; advance(e); msg=e.status==='finished_nr'?'Sequence finished.':`Next: ${stepLabel(e).toLowerCase()}.` } }
  if(o==='wrong'){ const v=sub.bad||goodNumbers(p)[0]?.v; const own=p.phones.find(x=>x.v===v); if(own) own.bad=true; else if(company(p).main?.v===v) company(p).main.bad=true;
    body=[`${v} marked wrong.`,note].filter(Boolean).join(' ');
    if(goodNumbers(p).length){ stay=true; msg='Another number still works, so this call stays open.' } else { e.skipped.push(e.idx); e.idx++; advance(e); msg='No working number left, so the call is skipped.' } }
  if(o==='callback'){ e.status='callback'; e.cb={day:+(sub.cbday||0),time:sub.cbtime||'14:00'}; body=[`Call back ${fmtDay(e.cb.day).toLowerCase()} at ${e.cb.time} their time.`,note].filter(Boolean).join(' '); msg='Messages are paused until then.' }
  if(o==='interested'){ e.status='interested'; msg='Automation stopped. Over to you.' }
  if(o==='declined'){ const path=sub.path||cp.declined, txt={stop:'Stopped in this campaign.',continue:'Other channels keep going.',winback:'Moved to win-back.'}[path];
    body=[note,txt].filter(Boolean).join(' ');
    if(path==='stop') e.status='declined'; else if(path==='continue'){ e.idx++; advance(e) } else { e.branch='wb'; e.idx=0; e.status='winback'; e.nextDue=1 }
    msg=txt }
  if(o==='skip' && e.status==='callback'){ e.cb={day:1,time:e.cb.time}; body='Callback moved to tomorrow.'; msg='Callback moved to tomorrow.' }
  else if(o==='skip'){ e.rolled=(e.rolled||0)+1; if(e.rolled>=2){ e.skipped.push(e.idx); e.idx++; advance(e); body='Not called for two days, so the call was skipped.'; msg='Call skipped. The next step starts.' } else { e.callDue=1; body='Moved to tomorrow.'; msg='Moved to tomorrow.' } }
  addEv(p.id,e.c,'call',`Call: ${names[o]}`,body);
  if(note && sub.co) S.notes.push({p:null,k:p.k,day:0,time:hm(NOW_MIN),text:note,fresh:true});
  S.ui.outcome=null; S.ui.sub={}; S.ui.dial=null;
  if(!stay){ S.ui.cur=callTasks().ready[0]?.e.id||null }
  toast(`${p.name}: ${names[o]}. ${msg}`); render(); window.scrollTo({top:0});
}
function bulk(kind){
  const u=S.ui, ids=[...u.sel];
  const targets=S.enrollments.filter(e=>ids.includes(e.p)&&(!u.fc||e.c===u.fc));
  const ok={pause:e=>LIVE.includes(e.status),resume:e=>e.status==='paused',stop:e=>LIVE.includes(e.status)||e.status==='paused'}[kind];
  const hit=targets.filter(ok), Verb=kind[0].toUpperCase()+kind.slice(1);
  u.confirm={text:`${Verb} ${hit.length} campaign enrollment${hit.length===1?'':'s'} for ${ids.length} ${ids.length===1?'person':'people'}${u.fc?` in ${C(u.fc).name}`:''}?${targets.length-hit.length?` ${targets.length-hit.length} can’t be changed in their current status and will be left alone.`:''}`,yes:Verb,
    run:()=>{hit.forEach(e=>{ if(kind==='pause'){e.prev=e.status;e.status='paused'} if(kind==='resume')e.status=e.prev||'active'; if(kind==='stop')e.status='stopped'; addEv(e.p,e.c,'system',{pause:'Paused by you',resume:'Resumed',stop:'Stopped by you'}[kind])}); toast(`${{pause:'Paused',resume:'Resumed',stop:'Stopped'}[kind]} ${hit.length} enrollment${hit.length===1?'':'s'}`); u.sel.clear()}};
  render();
}
function bulkAdd(cid){
  const ids=[...S.ui.sel]; let n=0,already=0;
  ids.forEach(pid=>{ if(enrOf(pid).some(e=>e.c===cid)){already++;return}
    S.enrollments.push({id:'e'+Math.random().toString(36).slice(2,7),p:pid,c:cid,idx:0,status:'queued',skipped:[]}); addEv(pid,cid,'system','Added to campaign','Queued until an inbox has room.'); n++ });
  S.ui.sel.clear(); toast(`Added ${n} to ${C(cid).name}${already?`. ${already} ${already===1?'was':'were'} already in it`:''}.`);
}

/* ============ render + events ============ */
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||'today';
  let html;
  if(h==='calls') html=viewCalls(); else if(h==='leads') html=viewLeads(); else if(h==='campaigns') html=viewCampaigns(); else if(h==='guide') html=viewGuide();
  else if(h.startsWith('p-')) html=viewPerson(h.slice(2)); else html=viewToday();
  nav();
  const a=document.activeElement, fid=a?.id, pos=a?.selectionStart;
  const showSearch=!['calls','leads','guide'].includes(h);
  $('#view').innerHTML=(showSearch?topSearch():'')+html;
  if(fid){const el=document.getElementById(fid); if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function setVariant(v){ S.ui.variant=v; try{localStorage.setItem('dw-variant',v)}catch(e){}
  if(!location.hash.startsWith('#p-')) location.hash='#p-p8'; else render(); }
document.querySelectorAll('.proto [data-v]').forEach(b=>b.onclick=()=>setVariant(b.dataset.v));
$('#reset').onclick=()=>{const v=S.ui.variant;S=seed();S.ui.variant=v;toast('Demo reset');if(location.hash==='#today')render();else location.hash='#today'};
document.addEventListener('keydown',ev=>{ const a=document.activeElement; if(a&&(['INPUT','TEXTAREA','SELECT'].includes(a.tagName)||a.isContentEditable))return;
  if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){const vs=['A','B','C'],i=vs.indexOf(S.ui.variant);setVariant(vs[(i+(ev.key==='ArrowRight'?1:2))%3])} });
document.addEventListener('keydown',ev=>{ if(ev.target.id==='quick'&&ev.key==='Enter'){S.ui.q=ev.target.value;S.ui.fc='';S.ui.fs='';location.hash='#leads';render()} });
window.addEventListener('hashchange',()=>{S.ui.confirm=null;S.ui.tlc='';render();window.scrollTo({top:0})});

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.matches('input[type=checkbox][data-sel],#selall')) return;
  const d=t.closest('[data-task],[data-oc],[data-dial],[data-act],[data-tab],[data-chip],[data-note],[data-enroll],[data-bulk],[data-camp],[data-go],[data-nouse],[data-co],#logoc,#confYes,#confNo,#reconnect,#clearf');
  if(!d) return;
  const u=S.ui;
  if(d.dataset.nouse){ u.fs='finished_nouse'; u.fc=''; u.q=''; return }
  if(d.dataset.co){ u.q=d.dataset.co; u.fc=''; u.fs=''; return }
  if(d.dataset.task){ u.cur=d.dataset.task; u.outcome=null; u.sub={}; u.dial=null; render(); return }
  if(d.dataset.oc){ u.outcome=d.dataset.oc; u.sub={note:$('#callnote')?.value,co:$('#callnoteco')?.checked}; render(); return }
  if(d.dataset.dial){ u.dial=d.dataset.dial; u.sub.note=$('#callnote')?.value; render(); return }
  if(d.id==='logoc'){ logOutcome(); return }
  if(d.dataset.act){ act(d.dataset.act,d.dataset.e); return }
  if(d.dataset.tab){ u.tab=d.dataset.tab; render(); return }
  if(d.dataset.chip){ u.chip=u.chip===d.dataset.chip?null:d.dataset.chip; render(); return }
  if(d.dataset.note){ const pid=d.dataset.note, txt=$('#note-'+pid).value.trim(); if(!txt){toast('Write the note first.');return}
    const co=$('#noteco-'+pid)?.checked; S.notes.push({p:co?null:pid,k:co?P(pid).k:null,day:0,time:hm(NOW_MIN),text:txt,fresh:true}); toast(co?`Note added for everyone at ${company(P(pid)).name}.`:'Note added.'); render(); return }
  if(d.dataset.enroll){ const pid=d.dataset.enroll, cid=$('#enr-'+pid).value; S.enrollments.push({id:'e'+Math.random().toString(36).slice(2,7),p:pid,c:cid,idx:0,status:'queued',skipped:[]}); addEv(pid,cid,'system','Added to campaign','Queued until an inbox has room.'); toast(`Added ${P(pid).name} to ${C(cid).name}`); render(); return }
  if(d.dataset.bulk){ if(d.dataset.bulk==='clear'){u.sel.clear();u.confirm=null;render();return} bulk(d.dataset.bulk); return }
  if(d.id==='confYes'){ const r=u.confirm.run; u.confirm=null; r(); render(); return }
  if(d.id==='confNo'){ u.confirm=null; render(); return }
  if(d.id==='clearf'){ u.q='';u.fc='';u.fs='';u.sel.clear(); render(); return }
  if(d.id==='reconnect'){ S.attention=S.attention.filter(a=>a.id!=='sms'); toast('SMS number reconnected. Held SMS steps go out in their next window.'); render(); return }
  if(d.dataset.camp){ const c=C(d.dataset.camp);
    u.confirm={text:c.state==='active'?`Pause ${c.name}? Messages stop, its calls leave your list, and every waiting time freezes.`:`Resume ${c.name}? Each lead continues where it was, spread across the sending window.`,yes:c.state==='active'?'Pause campaign':'Resume campaign',
      run:()=>{c.state=c.state==='active'?'paused':'active'; toast(`${c.state==='active'?'Resumed':'Paused'} ${c.name}`)}}; render(); window.scrollTo({top:0}); return }
  if(d.dataset.go && !t.closest('a,button,input,select,label')){ location.hash=d.dataset.go; return }
});
document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='q'){S.ui.q=t.value;S.ui.sel.clear();render()}
  if(t.id==='callnote'){S.ui.sub.note=t.value}
});
document.addEventListener('change',ev=>{ const t=ev.target, u=S.ui;
  if(t.id==='fc'){u.fc=t.value;u.sel.clear();render()} if(t.id==='fs'){u.fs=t.value;u.sel.clear();render()}
  if(t.dataset.sel){ t.checked?u.sel.add(t.dataset.sel):u.sel.delete(t.dataset.sel); u.confirm=null; render() }
  if(t.id==='selall'){ document.querySelectorAll('[data-sel]').forEach(b=>t.checked?u.sel.add(b.dataset.sel):u.sel.delete(b.dataset.sel)); render() }
  if(t.id==='bulkcamp'&&t.value){ const cid=t.value, n=u.sel.size; u.confirm={text:`Add ${n} ${n===1?'person':'people'} to ${C(cid).name}? Anyone already in it is left alone.`,yes:'Add to campaign',run:()=>bulkAdd(cid)}; render() }
  if(t.id==='redial'){u.sub.redial=t.checked;u.sub.note=$('#callnote')?.value;render()}
  if(t.name==='badnum') u.sub.bad=t.value;
  if(t.id==='cbday') u.sub.cbday=t.value; if(t.id==='cbtime') u.sub.cbtime=t.value;
  if(t.name==='path') u.sub.path=t.value;
  if(t.id==='callnoteco') u.sub.co=t.checked;
  if(t.dataset.tlc){ u.tlc=t.value; render() }
});
render();
</script>
